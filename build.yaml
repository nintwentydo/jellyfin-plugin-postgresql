overview: "Run Jellyfin's database on PostgreSQL"
description: >
  Replaces Jellyfin's built-in SQLite database with PostgreSQL for a single
  Jellyfin server. Requires a fresh database; there is no in-place
  migration from an existing SQLite library.
category: "General"
owner: "nintwentydo"
artifacts:
- "Jellyfin.Plugin.Postgresql.dll"
- "Npgsql.dll"
- "Npgsql.EntityFrameworkCore.PostgreSQL.dll"
changelog: >
  Harden native PostgreSQL migration recovery with transactional restores,
  missing-backup errors and subprocess cancellation. Forward compatible TLS
  settings to PostgreSQL client tools. Add PostgreSQL 18 integration coverage
  for recovery, concurrent writes and SQLite-compatible date handling,
  with tests aligned to Jellyfin 12.0.0.
