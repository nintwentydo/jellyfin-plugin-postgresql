name: '🔬 Run CodeQL'

on:
  push:
    branches: [ master, codex/custom-core-restore ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ master, codex/custom-core-restore ]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '24 2 * * 4'
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/checkout-core
      - name: Restore and prebuild dependencies
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality
      - name: Build plugin and tests for analysis
        run: dotnet build --configuration Release --no-restore --no-dependencies -t:Rebuild
      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
