name: '📦 Release Custom Pair'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate custom tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require the versioned custom tag
        run: |
          version=$(sed -nE 's/^version: *"?([0-9]+(\.[0-9]+){3})"?[[:space:]]*$/\1/p' build.yaml)
          test -n "$version"
          if [ "$GITHUB_REF" != "refs/tags/${version}-jf13-custom" ]; then
            echo "::error::Select the tag matching build.yaml's version with the -jf13-custom suffix."
            exit 1
          fi

  tests:
    needs: validate
    uses: ./.github/workflows/test.yaml

  codeql:
    needs: validate
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/scan-codeql.yaml

  build:
    needs: validate
    uses: ./.github/workflows/build.yaml

  publish:
    name: Publish custom prerelease
    needs: [tests, codeql, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Record source provenance
        run: |
          cp .github/actions/checkout-core/action.yml release/core-source.yml
          cat > release/SOURCES.txt <<EOF
          Plugin: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          Core repository: https://github.com/nintwentydo/jellyfin
          Core base: 46639d35ffe98b72a280ada4c436aa401728e4fb
          Applied commits, in order:
            42b507efe1ccdf530714e46842e1e1131559c324
            2d4850107a4ee60ebbfde662278eb42e45d11c27
            544b893886f1c623295fa04ccf128cde7f6a6ae6
          Reconstructed core tree: abccaa9a1811f6ba9a4493c3bfd9057567397ed6
          Reconstruction instructions: core-source.yml
          EOF
          test -f release/jellyfin-13-custom-linux-x64.tar.gz
          test -f release/jellyfin-13-custom-linux-arm64.tar.gz
      - name: Checksum release assets
        working-directory: release
        run: sha256sum ./*.zip ./*.tar.gz core-source.yml SOURCES.txt > SHA256SUMS
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --latest=false \
            --title 'PostgreSQL 1.1.3.0 — custom Jellyfin 13' \
            --notes-file docs/custom-release.md
