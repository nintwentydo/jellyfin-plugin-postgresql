name: '📦 Release Plugin'

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested candidate (select its matching version tag)
        type: boolean
        default: false

permissions:
  contents: read

# Serialize publication, including re-runs, so a version tag cannot be replaced.
concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release metadata
        id: release
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          version=$(sed -nE 's/^version: "([0-9]+(\.[0-9]+){3})"$/\1/p' build.yaml)
          base=$(sed -n 's/^ARG JELLYFIN_BASE=//p' docker/Dockerfile)
          test -n "$version"
          test -n "$base"
          jellyfin=${base#*:}
          jellyfin=${jellyfin%@*}
          if [ "$PUBLISH" = true ]; then
            case "$GITHUB_REF" in
              "refs/tags/$version"|"refs/tags/v$version") ;;
              *) echo "::error::Publication requires a tag matching build.yaml (optional v prefix)."; exit 1 ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$GITHUB_REPOSITORY_OWNER/jellyfin-postgres" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
          echo "image_tag=${version}-jf${jellyfin}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  tests:
    needs: validate
    uses: ./.github/workflows/test.yaml

  codeql:
    needs: validate
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/scan-codeql.yaml

  build:
    needs: validate
    uses: ./.github/workflows/build.yaml

  images:
    name: Native ${{ matrix.architecture }} image
    needs: [validate, tests, codeql, build]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin-package
          path: release
      - name: Stage the shared plugin package
        run: python3 docker/stage-plugin.py release/*.zip
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          push: false
          tags: jellyfin-postgres:candidate
          build-args: |
            PLUGIN_VERSION=${{ needs.validate.outputs.version }}
            PLUGIN_REVISION=${{ needs.validate.outputs.revision }}
      - name: Test the native candidate
        run: python3 docker/smoke-test.py jellyfin-postgres:candidate '${{ matrix.architecture }}'
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image under a run-specific candidate tag
        if: inputs.publish
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          ARCH: ${{ matrix.architecture }}
        run: |
          candidate="$IMAGE:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$ARCH"
          docker tag jellyfin-postgres:candidate "$candidate"
          docker push "$candidate"
          mkdir digests
          docker image inspect "$candidate" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep -F "$IMAGE@" > "digests/$ARCH.txt"
      - uses: actions/upload-artifact@v4
        if: inputs.publish
        with:
          name: image-digest-${{ matrix.architecture }}
          path: digests/*.txt
          if-no-files-found: error

  publish:
    name: Publish tested fork release
    if: inputs.publish
    needs: [validate, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ${{ needs.validate.outputs.image }}
      IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plugin-package
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published image tag
        run: |
          if docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" > "$RUNNER_TEMP/manifest.txt" 2>&1; then
            echo "::error::Image tag already exists; bump the plugin version."
            exit 1
          fi
          # Authentication or network failures must not be mistaken for an absent tag.
          if ! grep -Eq 'manifest unknown|not found' "$RUNNER_TEMP/manifest.txt"; then
            cat "$RUNNER_TEMP/manifest.txt"
            exit 1
          fi
      - name: Join only the tested architecture digests
        run: |
          for arch in amd64 arm64; do
            digest=$(cat "digests/$arch.txt")
            test "${digest%@*}" = "$IMAGE"
            printf '%s\n' "${digest#*@}" | grep -Eq '^sha256:[0-9a-f]{64}$'
          done
          docker buildx imagetools create --tag "$IMAGE:$IMAGE_TAG" \
            "$(cat digests/amd64.txt)" "$(cat digests/arm64.txt)"
      - name: Record provenance and checksums
        run: |
          cp .github/actions/checkout-core/action.yml release/core-source.yml
          cp digests/*.txt release/
          cat > release/SOURCES.txt <<SOURCES
          Plugin: https://github.com/${GITHUB_REPOSITORY}/commit/${{ needs.validate.outputs.revision }}
          Core: https://github.com/nintwentydo/jellyfin/commit/fd3c85888d100f3a609d11a68bfee736b9b5b0c5
          Base image: $(sed -n 's/^ARG JELLYFIN_BASE=//p' docker/Dockerfile)
          Plugin image: $IMAGE:$IMAGE_TAG
          Validation: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          SOURCES
          cd release
          md5sum ./*.zip > "postgresql_${VERSION}.zip.md5"
          sha256sum ./*.zip core-source.yml SOURCES.txt amd64.txt arm64.txt > SHA256SUMS
      - name: Create fork-only prerelease
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --latest=false \
            --title "PostgreSQL $VERSION for Jellyfin 12.0.0-nintwentydo.1" \
            --notes-file docs/release-notes.md
