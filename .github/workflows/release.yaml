name: '📦 Release Plugin'

# Process: bump version in build.yaml, commit, create github release with tag matching version
# Builds the plugin with JPRM, attaches plugin and md5 to release, regenerates manifest.json, publishes docker package

on:
  release:
    types:
      - released
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build plugin zip
        id: jprm
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        with:
          dotnet-target: "net10.0"

      - name: Generate md5 checksum
        run: |
          zip="${{ steps.jprm.outputs.artifact }}"
          md5sum "$zip" > "$zip.md5"

      - name: Attach zip and checksum to the release
        uses: softprops/action-gh-release@50195ba7f6f93d1ac97ba8332a178e008ad176aa
        with:
          fail_on_unmatched_files: true
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ steps.jprm.outputs.artifact }}
            ${{ steps.jprm.outputs.artifact }}.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Reuses the zip JPRM just built, so build.yaml stays the only place that
      # lists which assemblies ship.
      - name: Stage the plugin for the Docker image
        run: unzip -q "${{ steps.jprm.outputs.artifact }}" -d docker/plugin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jellyfin-postgres:${{ github.event.release.tag_name || github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/jellyfin-postgres:latest

      - name: Regenerate manifest.json on master
        uses: Kevinjil/jellyfin-plugin-repo-action@a7832ecc44c6b1a45d531970f6647b8682b005b8
        with:
          ignorePrereleases: true
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pagesBranch: master
          pagesFile: manifest.json
