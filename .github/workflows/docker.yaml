name: '🐳 Build Custom Docker Image'

on:
  push:
    branches: [codex/custom-core-restore]
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yaml'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-1.1.3.0-jf13-custom
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nintwentydo/jellyfin-postgres
  RELEASE_TAG: 1.1.3.0-jf13-custom

jobs:
  image:
    name: Build, test and publish ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download released binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release"
      - name: Verify and stage released binaries
        run: python3 docker/stage-release.py "$RUNNER_TEMP/release" '${{ matrix.arch }}'
      - uses: docker/setup-buildx-action@v3
      - name: Build native candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_TAG }}-${{ matrix.arch }}
          build-args: |
            PLUGIN_VERSION=1.1.3.0
            IMAGE_REVISION=${{ github.sha }}
      - name: Verify native startup and PostgreSQL provider
        run: python3 docker/smoke-test.py "$IMAGE:$RELEASE_TAG-${{ matrix.arch }}" '${{ matrix.arch }}'
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          candidate="$IMAGE:$RELEASE_TAG-$ARCH"
          docker push "$candidate"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$candidate")
          [[ "$digest" == "$IMAGE@"* ]]
          [[ "${digest#*@}" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/digests/$ARCH.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish tested multiarch custom tag
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join immutable tested digests
        run: |
          images=()
          for arch in amd64 arm64; do
            digest=$(cat "$RUNNER_TEMP/digests/$arch.txt")
            [[ "$digest" == "$IMAGE@"* ]]
            [[ "${digest#*@}" =~ ^sha256:[0-9a-f]{64}$ ]]
            images+=("$digest")
          done
          docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" "${images[@]}"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG"
