name: '🧪 Test Plugin'

on:
  push:
    branches:
      - master
      - codex/custom-core-restore
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
      - codex/custom-core-restore
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
  workflow_call:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/checkout-core
      - run: dotnet test --configuration Debug

  entrypoint:
    name: Docker entrypoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh docker/test-entrypoint.sh

  postgres:
    name: PostgreSQL ${{ matrix.postgres }} integration with TLS
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 16, 17, 18]
    env:
      TZ: Australia/Melbourne
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/checkout-core
      - name: Install matching PostgreSQL client tools
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-client-${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"
      - name: Create non-superuser test role
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports[5432] }}
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: >-
          psql --no-psqlrc --set ON_ERROR_STOP=1
          --command "CREATE ROLE jellyfin_test WITH LOGIN CREATEDB NOSUPERUSER PASSWORD 'jellyfin_test';"
      - name: Require verified TLS and client certificates
        run: sh tests/setup-postgresql-tls.sh '${{ job.services.postgres.id }}' '${{ runner.temp }}/postgres-tls'
      - name: Check migration model
        run: |
          dotnet restore
          dotnet tool restore
          dotnet tool run dotnet-ef migrations has-pending-model-changes --project Jellyfin.Plugin.Postgresql --configuration Release
      - name: Test against PostgreSQL
        env:
          JELLYFIN_POSTGRES_TEST_CONNECTION: Host=localhost;Port=${{ job.services.postgres.ports[5432] }};Database=postgres;Username=jellyfin_test;Password=jellyfin_test;SSL Mode=VerifyFull;Root Certificate=${{ runner.temp }}/postgres-tls/ca.crt;SSL Certificate=${{ runner.temp }}/postgres-tls/client.pfx;SSL Password=test-client-key
          JELLYFIN_POSTGRES_TEST_TLS_DIRECTORY: ${{ runner.temp }}/postgres-tls
          PGSSLCERT: ${{ runner.temp }}/postgres-tls/client.crt
          PGSSLKEY: ${{ runner.temp }}/postgres-tls/client.key
        run: dotnet test --configuration Release
